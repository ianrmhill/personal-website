  - heading: "Personal Summary"
    text: |
      Dr. Ian Hill is a specialist in semiconductor reliability engineering, holding a Ph.D. in Electrical and Computer Engineering from the University of British Columbia alongside a B.A.Sc. in Electrical Engineering from the University of Waterloo. He currently lives in San Jose, California. View Ian's CV and don't be afraid to reach out to him via email for questions and/or discussions around his research, professional career, and interests.
