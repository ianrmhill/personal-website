  - heading: "Personal Website"
    text: |
      Not one to get left behind (and one who dislikes JavaScript), this website was constructed in August of 2025 using Anthropic's Claude Code with little manual intervention. Starting with a raw HTML + CSS template he built back in 2016, Ian leveraged generative AI to build out the features and design of this site. Software engineering experience was highly valuable in helping point Claude in the right directions for efficient structure, implementation, and bug fixes. Without technical background and practice scoping out bite-size tasks, many features would have been much harder to achieve, such as directing Claude to implement clean dynamic content loading from a YAML file for easy future website content updates.
