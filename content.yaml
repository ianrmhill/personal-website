Projects:
  - heading: "Custom 12nm FinFET Chip Design"
    text: |
        As part of his PhD dissertation, Ian implemented custom on-chip sensors for monitoring semiconductor aging in a 12nm FinFET fabrication process. The design of this chip took six months in total to learn FinFET layout techniques, implement the sensors and perform physically-aware simulations of the designs, route all the interconnects for the chip, put together the pad ring, and verify the full design against electrical and design rules. The finished design contains several different sensor types alongside all the control and read-out logic and multiplexing required to interface with various sensor instances. After the chips were fabricated and tested, accelerated life tests on the chips were conducted to demonstrate that the sensor designs were functional and effective in provide fine-grained data on the progression of aging in semiconductor devices. 
    image: "CustomChip"

